[project]
name = "ai-research-news"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8.9",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-google-community[gmail]>=5.1.1",
    "langchain-mistralai>=1.1.6",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "nbconvert>=7.17.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-research-news = "ai_research_news:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
